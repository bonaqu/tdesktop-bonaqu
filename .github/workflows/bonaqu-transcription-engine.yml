name: Bonaqu Local Transcription Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.bonaqu/tools/Build-Bonaqu-Whisper.ps1'
      - '.bonaqu/tools/Install-Bonaqu-WhisperModel.ps1'
      - '.bonaqu/local-transcription-models.json'
      - '.github/workflows/bonaqu-transcription-engine.yml'
      - 'docs/local-transcription.md'

permissions:
  contents: read

concurrency:
  group: bonaqu-transcription-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cpu-worker:
    name: Windows x64 CPU worker
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Bonaqu Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $paths = @(
            '.bonaqu\tools\Build-Bonaqu-Whisper.ps1',
            '.bonaqu\tools\Install-Bonaqu-WhisperModel.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$path contains PowerShell syntax errors."
            }
            Write-Host "[BONAQU] Parsed $path successfully."
          }

      - name: Validate pinned model manifest
        shell: pwsh
        run: |
          $path = '.bonaqu\local-transcription-models.json'
          $manifest = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($manifest.schema -ne 1) {
            throw 'Unexpected model manifest schema.'
          }
          if ($manifest.source.repository -ne 'https://huggingface.co/ggerganov/whisper.cpp') {
            throw 'Unexpected model source repository.'
          }
          if ($manifest.source.revision -ne '80da2d8bfee42b0e836fc3a9890373e5defc00a6') {
            throw 'Model manifest source revision changed without review.'
          }
          if ($manifest.worker.engine_commit -ne '233fe1fc9b48a09e361d3594520838ca266537fe') {
            throw 'Model manifest engine pin does not match the worker pin.'
          }

          $expected = @{
            base = @{
              filename = 'ggml-base.bin'
              bytes = 147951465
              sha256 = '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe'
            }
            small = @{
              filename = 'ggml-small.bin'
              bytes = 487601967
              sha256 = '1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b'
            }
          }
          $seen = @{}

          foreach ($entry in $manifest.models) {
            $id = [string]$entry.id
            if (-not $expected.ContainsKey($id)) {
              throw "Unexpected model id '$id'."
            }
            if ($seen.ContainsKey($id)) {
              throw "Duplicate model id '$id'."
            }
            $seen[$id] = $true

            $wanted = $expected[$id]
            $actualFilename = [string]$entry.filename
            $actualBytes = [int64]$entry.bytes
            $actualSha256 = [string]$entry.sha256
            if ($actualFilename -ne [string]$wanted.filename -or
                $actualBytes -ne [int64]$wanted.bytes -or
                $actualSha256 -ne [string]$wanted.sha256) {
              throw "Pinned metadata mismatch for model '$id'."
            }

            $expectedUrl = "https://huggingface.co/ggerganov/whisper.cpp/resolve/$($manifest.source.revision)/$actualFilename"
            if ([string]$entry.url -ne $expectedUrl) {
              throw "Model '$id' URL does not exactly match its reviewed pinned file."
            }
          }

          if ($manifest.models.Count -ne $expected.Count) {
            throw 'Model manifest entry count changed unexpectedly.'
          }
          foreach ($expectedId in $expected.Keys) {
            if (-not $seen.ContainsKey([string]$expectedId)) {
              throw "Expected model '$expectedId' is missing from the manifest."
            }
          }

          .\.bonaqu\tools\Install-Bonaqu-WhisperModel.ps1 -List

      - name: Validate model installer path guards
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bonaqu-model-path-guards'
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root | Out-Null

          try {
            $destination = Join-Path $root 'ggml-base.bin'
            New-Item -ItemType Directory -Path $destination | Out-Null
            $output = @(
              & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -NonInteractive -File .\.bonaqu\tools\Install-Bonaqu-WhisperModel.ps1 -Model base -DestinationDirectory $root -Remove 2>&1
            )
            if ($LASTEXITCODE -eq 0 -or (($output | Out-String) -notmatch 'not a regular file')) {
              throw "Directory collision at the final model path was not rejected. Output: $($output | Out-String)"
            }
            Write-Host '[PASS] Final model path rejects directory collisions.'
            Remove-Item -LiteralPath $destination -Recurse -Force

            $partial = Join-Path $root 'ggml-base.bin.part'
            New-Item -ItemType Directory -Path $partial | Out-Null
            $output = @(
              & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -NonInteractive -File .\.bonaqu\tools\Install-Bonaqu-WhisperModel.ps1 -Model base -DestinationDirectory $root 2>&1
            )
            if ($LASTEXITCODE -eq 0 -or (($output | Out-String) -notmatch 'Temporary model path exists but is not a regular file')) {
              throw "Directory collision at the temporary model path was not rejected. Output: $($output | Out-String)"
            }
            Write-Host '[PASS] Temporary model path rejects directory collisions.'
          } finally {
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force
            }
          }
          Write-Host '[BONAQU] Model installer path guards passed.'
          exit 0

      - name: Configure MSVC environment
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64

      - name: Build pinned whisper.cpp CPU worker
        shell: pwsh
        run: |
          .\.bonaqu\tools\Build-Bonaqu-Whisper.ps1 `
            -Clean `
            -OutputDirectory 'artifacts\BonaquLocalTranscription'

      - name: Verify engine package contract
        shell: pwsh
        run: |
          $root = 'artifacts\BonaquLocalTranscription'
          $required = @(
            'BonaquWhisperWorker.exe',
            'WHISPER-CPP-LICENSE.txt',
            'ENGINE-INFO.txt',
            'SHA256SUMS.txt'
          )
          foreach ($file in $required) {
            $path = Join-Path $root $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing worker artifact: $path"
            }
          }

          $cache = '.bonaqu\cache\local-transcription\build-whisper-cpu\CMakeCache.txt'
          if (-not (Test-Path -LiteralPath $cache -PathType Leaf)) {
            throw "whisper.cpp CMake cache was not found at $cache."
          }
          $cacheText = Get-Content -Raw -LiteralPath $cache
          $expectedCpuOptions = @(
            'GGML_NATIVE:BOOL=OFF',
            'GGML_SSE42:BOOL=ON',
            'GGML_AVX:BOOL=ON',
            'GGML_AVX2:BOOL=ON',
            'GGML_BMI2:BOOL=ON',
            'GGML_AVX512:BOOL=OFF'
          )
          foreach ($option in $expectedCpuOptions) {
            if ($cacheText -notmatch ('(?m)^' + [regex]::Escape($option) + '$')) {
              throw "whisper.cpp CPU baseline mismatch: expected $option."
            }
          }
          Write-Host '[BONAQU] CMake cache confirms deterministic AVX2 CPU baseline.'

          $worker = Join-Path $root 'BonaquWhisperWorker.exe'
          $versionOutput = @(& $worker --version 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged worker failed its --version smoke test with exit code $LASTEXITCODE. Output: $($versionOutput | Out-String)"
          }
          if (($versionOutput | Out-String) -notmatch 'whisper\.cpp version:') {
            throw "Packaged worker returned unexpected --version output: $($versionOutput | Out-String)"
          }
          Write-Host "[BONAQU] Packaged worker launch smoke passed: $($versionOutput | Out-String)"

          $info = Get-Content -Raw -LiteralPath (Join-Path $root 'ENGINE-INFO.txt')
          if ($info -notmatch '233fe1fc9b48a09e361d3594520838ca266537fe') {
            throw 'Worker metadata does not contain the reviewed whisper.cpp commit pin.'
          }
          if ($info -notmatch 'Models bundled: no') {
            throw 'Worker package contract unexpectedly claims a bundled model.'
          }
          if ($info -notmatch 'CPU tuning: deterministic AVX2 baseline \(GGML_NATIVE=OFF\)') {
            throw 'Worker package contract does not describe the reviewed deterministic AVX2 CPU baseline.'
          }

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $worker).Hash.ToLowerInvariant()
          $sums = Get-Content -Raw -LiteralPath (Join-Path $root 'SHA256SUMS.txt')
          if ($sums -notmatch [regex]::Escape($actual)) {
            throw 'Worker SHA-256 manifest does not match the built executable.'
          }

          @(
            '## Bonaqu local transcription worker',
            '',
            '- Platform: Windows x64',
            '- Backend: deterministic AVX2 CPU baseline (GGML_NATIVE=OFF)',
            '- Source: ggml-org/whisper.cpp',
            '- Pinned commit: 233fe1fc9b48a09e361d3594520838ca266537fe',
            '- Model bundled: no',
            "- Worker SHA-256: $actual",
            '',
            'This is an engine foundation artifact, not a completed Telegram transcription feature.'
          ) | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY

      - name: Upload optional worker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Bonaqu-Local-Transcription-Worker-Windows-x64-${{ github.sha }}
          path: artifacts\BonaquLocalTranscription\
          if-no-files-found: error
          retention-days: 14
