name: Bonaqu Desktop Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LEGAL'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: bonaqu-win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 Release (Test API)
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      TBUILD: ${{ github.workspace }}\TBuild
      REPO_NAME: tdesktop-bonaqu
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      LIBRARIES_PATH: ${{ github.workspace }}\TBuild\Libraries\win64

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare short TBuild path
        run: |
          if not exist "%USERPROFILE%\TBuild\Libraries" mkdir "%USERPROFILE%\TBuild\Libraries"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild\tdesktop-bonaqu

      - name: Validate WEB Proxy source contract
        shell: pwsh
        run: |
          $root = Join-Path $env:TBUILD 'tdesktop-bonaqu'
          $required = @(
            'Telegram\SourceFiles\mtproto\web_proxy\web_proxy_frame.cpp',
            'Telegram\SourceFiles\mtproto\web_proxy\web_proxy_transport.cpp',
            'Telegram\SourceFiles\mtproto\web_proxy\web_proxy_webview.cpp',
            'Telegram\SourceFiles\mtproto\details\mtproto_web_proxy_socket.cpp',
            'docs\web-proxy-plan.md',
            'docs\web-proxy-test-plan.md'
          )
          foreach ($relative in $required) {
            $path = Join-Path $root $relative
            if (-not (Test-Path $path)) {
              throw "Required WEB Proxy source is missing: $relative"
            }
          }
          $proxyData = Get-Content -Raw (Join-Path $root 'Telegram\SourceFiles\mtproto\mtproto_proxy_data.cpp')
          if ($proxyData -notmatch 'Type::Web' -or $proxyData -notmatch 'NormalizeWebProxyHost') {
            throw 'WEB Proxy data model/validation was not found in mtproto_proxy_data.cpp'
          }
          $version = Get-Content -Raw (Join-Path $root 'Telegram\SourceFiles\core\version.h')
          if ($version -notmatch 'AppName = "Bonaqu Desktop"') {
            throw 'Bonaqu Desktop runtime branding is missing.'
          }

      - name: Read SDK and build cache key
        shell: bash
        run: |
          DOCPATH="$GITHUB_WORKSPACE/TBuild/tdesktop-bonaqu/docs/building-win.md"
          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/' | head -n1)"
          if [ -z "$SDK" ]; then
            echo "Could not determine required Windows SDK from docs/building-win.md" >&2
            exit 1
          fi
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          {
            sha256sum "$GITHUB_WORKSPACE/TBuild/tdesktop-bonaqu/$PREPARE_PATH"
            printf '%s\n' "$SDK"
          } > CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> "$GITHUB_ENV"
          echo "Required SDK: $SDK"

      - name: Configure MSVC environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Configure NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit /b 0

      - name: Cache third-party sources
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: bonaqu-thirdparty-${{ runner.os }}-${{ env.CACHE_KEY }}
          restore-keys: |
            bonaqu-thirdparty-${{ runner.os }}-

      - name: Cache prepared libraries
        uses: actions/cache@v6
        with:
          path: ${{ env.LIBRARIES_PATH }}
          key: bonaqu-libs-${{ runner.os }}-${{ env.CACHE_KEY }}
          restore-keys: |
            bonaqu-libs-${{ runner.os }}-

      - name: Prepare Telegram Desktop dependencies
        run: |
          cd /d "%TBUILD%\tdesktop-bonaqu"
          Telegram\build\prepare\win.bat skip-release silent

      - name: Configure Bonaqu Desktop
        run: |
          cd /d "%TBUILD%\tdesktop-bonaqu\Telegram"
          call configure.bat x64 ^
            -D TDESKTOP_API_TEST=ON ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build Bonaqu Desktop
        run: |
          cd /d "%TBUILD%\tdesktop-bonaqu\Telegram"
          cmake --build ..\out --config Release --target Telegram --parallel

      - name: Package isolated Bonaqu test build
        shell: pwsh
        run: |
          $out = Join-Path $env:TBUILD 'tdesktop-bonaqu\out\Release'
          $package = Join-Path $env:GITHUB_WORKSPACE 'BonaquDesktop-Windows-x64-TestAPI'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $telegram = Join-Path $out 'Telegram.exe'
          if (-not (Test-Path $telegram)) {
            throw "Telegram.exe was not produced at $telegram"
          }

          $exe = Join-Path $package 'BonaquDesktop.exe'
          Copy-Item $telegram $exe

          @'
          @echo off
          setlocal
          set "ROOT=%~dp0"
          if not exist "%ROOT%BonaquProfile" mkdir "%ROOT%BonaquProfile"
          start "Bonaqu Desktop" "%ROOT%BonaquDesktop.exe" -workdir "%ROOT%BonaquProfile" -noupdate
          '@ | Set-Content -Encoding ASCII (Join-Path $package 'Start-Bonaqu-Desktop.cmd')

          @'
          @echo off
          setlocal
          set "ROOT=%~dp0"
          if not exist "%ROOT%BonaquProfile" mkdir "%ROOT%BonaquProfile"
          start "Bonaqu Desktop Debug" "%ROOT%BonaquDesktop.exe" -workdir "%ROOT%BonaquProfile" -noupdate -debug
          '@ | Set-Content -Encoding ASCII (Join-Path $package 'Start-Bonaqu-Desktop-Debug.cmd')

          $sha256 = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          @"
          Bonaqu Desktop experimental Windows x64 build
          Source commit: $env:GITHUB_SHA
          Build mode: Release
          Telegram API mode: TDESKTOP_API_TEST=ON (TEST ONLY)
          Auto-update: disabled
          Crash reporting: disabled
          Executable SHA-256: $sha256

          IMPORTANT:
          Start the client with Start-Bonaqu-Desktop.cmd. It forces an isolated
          BonaquProfile working directory next to the executable so this experimental
          build does not reuse your normal Telegram Desktop tdata profile.

          Start-Bonaqu-Desktop-Debug.cmd enables Telegram debug logging for diagnosis.
          Do not publish logs until they have been checked for private information.

          This build uses Telegram Desktop's test-only API credentials and is intended
          only for development/testing of the WEB Proxy implementation. Telegram's
          own documentation warns that TEST ONLY credentials are heavily limited and
          are not suitable for deployment.
          "@ | Set-Content -Encoding UTF8 (Join-Path $package 'BUILD-INFO.txt')

          "$sha256  BonaquDesktop.exe" | Set-Content -Encoding ASCII (Join-Path $package 'SHA256SUMS.txt')

      - name: Upload Bonaqu Desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bonaqu-Desktop-Windows-x64-TestAPI-${{ github.sha }}
          path: BonaquDesktop-Windows-x64-TestAPI\
          if-no-files-found: error
          retention-days: 14
